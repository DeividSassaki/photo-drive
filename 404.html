<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Slides do Google Drive 📸</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #4f46e5; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button.action-btn { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button.action-btn:hover { background: #4338ca; }
        #status-text { margin: 10px 0; color: #aaa; font-size: 14px; }
        
        /* Layout do Slider */
        .slider-container { width: 90%; max-width: 900px; height: 70vh; overflow: hidden; position: relative; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.7); display: none; background: #000; }
        .slide { width: 100%; height: 100%; border: none; display: none; }
        .slide.active { display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 18px; cursor: pointer; font-size: 20px; border-radius: 50%; z-index: 10; }
        .prev { left: 15px; }
        .next { right: 15px; }
        .back-btn { margin-top: 20px; background: #333; color: #ccc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: none; font-weight: bold;}
        .back-btn:hover { background: #444; color: #fff; }
    </style>
</head>
<body>

    <!-- TELA INICIAL: ENTRADA DE LINK -->
    <div class="container" id="main-panel">
        <h2>Visualizador de Álbuns (Pastas) 📸</h2>
        <p>Cole abaixo o link ou o ID de uma <strong>pasta pública</strong> do Google Drive para listar as fotos automaticamente.</p>
        
        <input type="text" id="drive-folder" placeholder="Cole o link da pasta aqui...">
        <button class="action-btn" onclick="gerarSlideDaPasta()">Abrir Pasta como Slide</button>
        <div id="status-text"></div>
    </div>

    <!-- TELA DO SLIDER -->
    <div class="slider-container" id="slider">
        <button class="nav-btn prev" onclick="mudarSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="mudarSlide(1)">&#10095;</button>
    </div>
    
    <button class="back-btn" id="btn-voltar" onclick="voltarParaInicio()">◀ Voltar</button>

    <script>
        let slideIndex = 0;
        let slides = [];
        let intervalo;

        // Tenta ler caso o ID da pasta seja passado direto na URL (ex: ://seusite.com)
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const urlParam = pathSegments[pathSegments.length - 1];

        if (urlParam && urlParam.length >= 25 && urlParam !== "photo-drive") {
            buscarFotosDaPasta(urlParam);
        }

        function extrairFolderId(texto) {
            const match = texto.match(/folders\/([-\w]{25,})/);
            if (match) return match[1];
            const matchFile = texto.match(/[-\w]{25,}/);
            return matchFile ? matchFile[0] : texto.trim();
        }

        function gerarSlideDaPasta() {
            const inputVal = document.getElementById('drive-folder').value;
            if (!inputVal) return alert('Por favor, insira o link ou ID da pasta do Drive!');
            
            const folderId = extrairFolderId(inputVal);
            buscarFotosDaPasta(folderId);
        }

        async function buscarFotosDaPasta(folderId) {
            const statusBox = document.getElementById('status-text');
            statusBox.innerText = "Buscando arquivos da pasta pública... Aguarde.";
            
            // Usamos um proxy aberto para ler a lista de arquivos públicos da pasta via feed XML do Google
            const urlFeed = `https://google.com{folderId}?v=3&alt=json`;
            const urlProxy = `https://allorigins.win{encodeURIComponent(urlFeed)}`;

            try {
                const response = await fetch(urlProxy);
                const data = await response.json();
                
                // Converte o texto plano retornado em objeto JSON do feed do Google
                const feedData = JSON.parse(data.contents);
                const arquivos = feedData.feed.entry || [];

                // Filtra apenas itens que possuem links de arquivos de mídia
                const idsFotos = arquivos.map(entry => {
                    const idOriginal = entry.id.$t;
                    const partes = idOriginal.split('/');
                    return partes[partes.length - 1];
                });

                if (idsFotos.length === 0) {
                    statusBox.innerHTML = "<span style='color:#ff6b6b'>Nenhuma foto encontrada. Verifique se a pasta está configurada como 'Qualquer pessoa com o link'.</span>";
                    return;
                }

                statusBox.innerText = "";
                montarCarrossel(idsFotos);

            } catch (error) {
                statusBox.innerHTML = "<span style='color:#ff6b6b'>Erro ao acessar a pasta. Certifique-se de que ela está 100% pública.</span>";
                console.error(error);
            }
        }

        function montarCarrossel(listaDeIds) {
            document.getElementById('main-panel').style.display = 'none';
            const container = document.getElementById('slider');
            container.style.display = 'block';
            document.getElementById('btn-voltar').style.display = 'block';

            // Limpa o slider
            const antigosFrames = container.querySelectorAll('iframe');
            antigosFrames.forEach(f => f.remove());

            listaDeIds.forEach((id, index) => {
                const iframe = document.createElement('iframe');
                iframe.src = `https://google.com{id}/preview`;
                iframe.className = 'slide' + (index === 0 ? ' active' : '');
                container.appendChild(iframe);
            });

            slides = document.querySelectorAll('.slide');
            slideIndex = 0;

            if(slides.length > 0) {
                clearInterval(intervalo);
                intervalo = setInterval(() => mudarSlide(1), 5000); 
            }
        }

        function mudarSlide(direcao) {
            if (slides.length === 0) return;
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + direcao + slides.length) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        function voltarParaInicio() {
            clearInterval(intervalo);
            document.getElementById('slider').style.display = 'none';
            document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        }
    </script>
</body>
</html>
