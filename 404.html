<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Slides do Google Drive 📸</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #4f46e5; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button.action-btn { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button.action-btn:hover { background: #4338ca; }
        
        /* Ajuste do Slider para usar iFrames sem bordas */
        .slider-container { width: 90%; max-width: 900px; height: 70vh; overflow: hidden; position: relative; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.7); display: none; background: #000; }
        .slide { width: 100%; height: 100%; border: none; display: none; }
        .slide.active { display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 18px; cursor: pointer; font-size: 20px; border-radius: 50%; z-index: 10; }
        .prev { left: 15px; }
        .next { right: 15px; }
        .back-btn { margin-top: 20px; background: #333; color: #ccc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: none; font-weight: bold;}
        .back-btn:hover { background: #444; color: #fff; }
    </style>
</head>
<body>

    <!-- TELA INICIAL: ENTRADA DE LINK -->
    <div class="container" id="main-panel">
        <h2>Visualizador de Slides 📸</h2>
        <p>Cole abaixo os IDs ou Links das fotos do Google Drive separados por vírgula para criar seu slide instantâneo.</p>
        
        <input type="text" id="drive-links" placeholder="Ex: ID1, ID2, ID3 ou cole os links...">
        <button class="action-btn" onclick="gerarSlideDoInput()">Iniciar Slide</button>
        
        <p style="font-size: 13px; color: #aaa; margin-top: 15px; text-align: left;">
            <strong>Dica:</strong> Cole os IDs ou os links das fotos separados por vírgula para rodar o slide perfeitamente.
        </p>
    </div>

    <!-- TELA DO SLIDER -->
    <div class="slider-container" id="slider">
        <button class="nav-btn prev" onclick="mudarSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="mudarSlide(1)">&#10095;</button>
    </div>
    
    <button class="back-btn" id="btn-voltar" onclick="voltarParaInicio()">◀ Voltar e Mudar Fotos</button>

    <script>
        let slideIndex = 0;
        let slides = [];
        let intervalo;

        // Captura se o usuário passou IDs direto pela URL (ex: ://seusite.com)
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const urlParam = pathSegments[pathSegments.length - 1];

        if (urlParam && urlParam.length >= 25 && urlParam !== "photo-drive") {
            montarSlide(urlParam.split(','));
        }

        function extrairId(texto) {
            const match = texto.match(/[-\w]{25,}/);
            return match ? match[0] : texto.trim();
        }

        function gerarSlideDoInput() {
            const inputVal = document.getElementById('drive-links').value;
            if (!inputVal) return alert('Por favor, insira pelo menos um ID ou link do Drive!');
            
            const itens = inputVal.split(',').map(item => extrairId(item));
            montarSlide(itens);
        }

        function montarSlide(listaDeIds) {
            document.getElementById('main-panel').style.display = 'none';
            const container = document.getElementById('slider');
            container.style.display = 'block';
            document.getElementById('btn-voltar').style.display = 'block';

            // Limpa frames antigos
            const antigosFrames = container.querySelectorAll('iframe');
            antigosFrames.forEach(f => f.remove());

            listaDeIds.forEach((id, index) => {
                const limpoId = id.trim();
                if(limpoId.length < 10) return;
                
                // Correção ortográfica do link de incorporação (Iframe Preview)
                const iframe = document.createElement('iframe');
                iframe.src = "https://drive.google.com/file/d/" + limpoId + "/preview";
                iframe.className = 'slide' + (index === 0 ? ' active' : '');
                container.appendChild(iframe);
            });

            slides = document.querySelectorAll('.slide');
            slideIndex = 0;

            if(slides.length > 0) {
                clearInterval(intervalo);
                intervalo = setInterval(() => mudarSlide(1), 5000); 
            }
        }

        function mudarSlide(direcao) {
            if (slides.length === 0) return;
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + direcao + slides.length) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        function voltarParaInicio() {
            clearInterval(intervalo);
            document.getElementById('slider').style.display = 'none';
            document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        }
    </script>
</body>
</html>
