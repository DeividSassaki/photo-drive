<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Slides Imgur 📸</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #1bb76e; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 15px; }
        button.action-btn { background: #1bb76e; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s; }
        button.action-btn:hover { background: #159659; }
        #status-text { margin: 10px 0; color: #aaa; font-size: 14px; }
        
        /* Layout do Carrossel */
        .slider-container { width: 90%; max-width: 900px; height: 75vh; overflow: hidden; position: relative; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.7); display: none; background: #000; }
        .slide { width: 100%; height: 100%; object-fit: contain; display: none; }
        .slide.active { display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 18px; cursor: pointer; font-size: 20px; border-radius: 50%; z-index: 10; transition: 0.3s; }
        .nav-btn:hover { background: rgba(27, 183, 110, 0.7); }
        .prev { left: 15px; }
        .next { right: 15px; }
        .back-btn { margin-top: 20px; background: #333; color: #ccc; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; font-weight: bold; transition: 0.2s;}
        .back-btn:hover { background: #444; color: #fff; }
    </style>
</head>
<body>

    <!-- PAINEL PRINCIPAL (TELA INICIAL) -->
    <div class="container" id="main-panel">
        <h2>Visualizador de Álbuns Imgur 📸</h2>
        <p>Cole o link ou o ID de um álbum do Imgur (pode ser Oculto/Hidden) para gerar o slide automático.</p>
        <input type="text" id="album-input" placeholder="Ex: https://imgur.com ou apenas ABCDE">
        <button class="action-btn" onclick="processarInput()">Iniciar Slide</button>
        <div id="status-text"></div>
    </div>

    <!-- RECIPIENTE DO SLIDER -->
    <div class="slider-container" id="slider">
        <button class="nav-btn prev" onclick="mudarSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="mudarSlide(1)">&#10095;</button>
    </div>
    
    <button class="back-btn" id="btn-voltar" onclick="voltarParaInicio()">◀ Escolher Outro Álbum</button>

    <script>
        let slideIndex = 0;
        let slides = [];
        let intervalo;

        // Captura o ID do álbum direto do final da URL se houver (ex: ://seusite.com)
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const urlParam = pathSegments[pathSegments.length - 1];

        if (urlParam && urlParam.length >= 4 && urlParam !== "photo-drive") {
            buscarAlbumImgur(urlParam);
        }

        function extrairAlbumId(texto) {
            const limpo = texto.trim();
            
            // Nova regra que extrai o texto puro de 7 letras do ID, ignorando tudo antes
            const match = limpo.match(/([a-zA-Z0-9]{5,10})$/);
            if (match) {
                return match[1]; // O [1] garante que o código envie apenas as letras puras (MEkPFK5) para a API!
            }
            return limpo;
        }
        function processarInput() {
            const valor = document.getElementById('album-input').value;
            if (!valor) return alert('Por favor, digite o ID ou cole o link do álbum!');
            
            const albumId = extrairAlbumId(valor);
            
            // Altera a URL no navegador sem recarregar a página para gerar o link compartilhável
            const novaUrl = window.location.origin + window.location.pathname + (window.location.pathname.endsWith('/') ? '' : '/') + albumId;
            window.history.pushState({}, '', novaUrl);
            
            buscarAlbumImgur(albumId);
        }

        async function buscarAlbumImgur(albumId) {
            const statusBox = document.getElementById('status-text');
            statusBox.innerText = "Carregando imagens do álbum...";

            // Faz a requisição pública para a API anônima do Imgur sem precisar de chaves complexas
            const urlAPI = `https://imgur.com{albumId}/images`;
            
            try {
                // Usamos o Client-ID padrão de código aberto para listar as imagens
                const response = await fetch(urlAPI, {
                    headers: { 'Authorization': 'Client-ID 546c25a59c58ad7' }
                });
                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    statusBox.innerHTML = "<span style='color:#ff6b6b'>Álbum não encontrado. Verifique se o ID está correto e se ele não é 100% privado (mude para Hidden).</span>";
                    window.history.pushState({}, '', window.location.origin + window.location.pathname);
                    return;
                }

                statusBox.innerText = "";
                montarCarrossel(data.data);

            } catch (error) {
                statusBox.innerHTML = "<span style='color:#ff6b6b'>Erro ao conectar com o Imgur. Tente novamente.</span>";
                console.error(error);
            }
        }

        function montarCarrossel(imagens) {
            document.getElementById('main-panel').style.display = 'none';
            const container = document.getElementById('slider');
            container.style.display = 'block';
            document.getElementById('btn-voltar').style.display = 'block';

            // Limpa slides antigos
            container.querySelectorAll('img').forEach(img => img.remove());

            // Adiciona cada imagem do Imgur na tela usando tags <img> nativas super leves
            imagens.forEach((imgData, index) => {
                const img = document.createElement('img');
                img.src = imgData.link; // Link direto oficial da foto (.jpg, .png etc)
                img.className = 'slide' + (index === 0 ? ' active' : '');
                container.appendChild(img);
            });

            slides = document.querySelectorAll('.slide');
            slideIndex = 0;

            if (slides.length > 0) {
                clearInterval(intervalo);
                // Transição automática das fotos a cada 4 segundos
                intervalo = setInterval(() => mudarSlide(1), 4000); 
            }
        }

        function mudarSlide(direcao) {
            if (slides.length === 0) return;
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + direcao + slides.length) % slides.length;
            slides[slideIndex].classList.add('active');
        }

        function voltarParaInicio() {
            clearInterval(intervalo);
            document.getElementById('slider').style.display = 'none';
            document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('album-input').value = "";
            // Reseta a URL limpando o ID antigo
            window.history.pushState({}, '', window.location.origin + window.location.pathname);
        }
    </script>
</body>
</html>
